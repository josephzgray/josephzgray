# 每天生成一次贡献格子"贪吃蛇"动画，推到 output 分支，README 从那里引用
name: Generate contribution snake

on:
  schedule:
    - cron: "0 16 * * *" # 北京时间每天 00:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7f5af0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7f5af0

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
