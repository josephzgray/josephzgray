<text x="26" y="356" font-size="13" fill="#87382d">「衡门之下，可以栖迟」——《诗经·陈风》</text>
<text x="26" y="384" font-size="14" fill="#4b584f">本地生活点评与优惠券秒杀平台：令牌限流、多级缓存、</text><text x="26" y="406" font-size="14" fill="#4b584f">Kafka 可靠投递、数据一致性对账与分库分表。</text>
